[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maya3"
version = "0.1.0"
description = "Maya3 TTS: streaming multilingual (12 Indic languages + English) text-to-speech with zero-shot voice cloning"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# Pins are the versions the engine was built and measured with (torch 2.8.0+cu128, transformers 5.6.2).
# torch / torchaudio cu128 wheels come from https://download.pytorch.org/whl/cu128 (see README.md "Install").
dependencies = [
    "torch==2.8.0",            # brings triton 3.4.0 (the fused backbone / depth kernels)
    "torchaudio==2.8.0",       # speechbrain needs it; must match torch
    "transformers==5.6.2",     # Qwen3 backbone, MimiModel, DynamicCache layout used by serve/cache.py
    "tokenizers>=0.22,<0.23",
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "speechbrain==1.1.2",      # ECAPA-TDNN speaker embedding (spkrec-ecapa-voxceleb)
    "huggingface_hub>=1.0",
    "safetensors>=0.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# HTTP (OpenAI-compatible) + WebSocket server and the client (maya3.server, maya3.client)
server = ["aiohttp>=3.10"]
# CPU test suite (maya3/tests): server tests run against a fake engine
dev = ["aiohttp>=3.10", "pytest>=8", "pytest-asyncio>=0.23", "pytest-aiohttp>=1.0"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
# serve/ and scripts/ have no __init__.py (namespace packages); configs/ is shipped as data at the project root
# because maya3/engine.py reads <root>/configs/s3_fresh_v1.yaml and <root>/configs/text_frames_prior.json.
include = ["maya3", "maya3.*", "tts", "tts.*", "serve", "scripts", "configs"]
namespaces = true

[tool.setuptools.package-data]
maya3 = ["assets/*.json"]
configs = ["s3_fresh_v1.yaml", "text_frames_prior.json"]
